services:
  # Backend API Service
  - type: web
    name: habit-tracker-api
    env: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Environment variables (will be set in Render dashboard)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        # Set this in Render dashboard to an external Postgres
        # (e.g. Neon/Supabase). We avoid binding to a Render DB
        # so the backend won't break when free DB expires.
        sync: false
      - key: JWT_SECRET
        generateValue: true
